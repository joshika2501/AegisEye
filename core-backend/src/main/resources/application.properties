spring.application.name=core-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

aegissight.jwt.secret=${JWT_SECRET}
aegissight.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
aegissight.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
aegissight.app.version=1.0.0-prototype
aegissight.app.service-name=aegissight-backend

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
